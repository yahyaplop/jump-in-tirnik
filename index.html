<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Гимнастика 3D - Коллизии Стен</title>
<style>
  * { -webkit-touch-callout: none !important; -webkit-user-select: none !important; user-select: none !important; box-sizing: border-box; }
  body { margin: 0; overflow: hidden; background: #87CEEB; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; touch-action: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #ui { position: absolute; inset: 0; pointer-events: none; }

  /* --- МЕНЮ --- */
  #menu-overlay {
    position: absolute; inset: 0; background: rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    pointer-events: auto; z-index: 100; transition: opacity 0.3s ease;
    padding: 20px;
  }
  #menu-overlay.hidden { opacity: 0; pointer-events: none; }
  
  .menu-title { font-size: 28px; font-weight: 900; color: #fff; text-shadow: 0 4px 10px rgba(0,0,0,0.5); margin-bottom: 20px; text-transform: uppercase; letter-spacing: 2px; text-align: center; }
  .section-title { font-size: 14px; color: #aaa; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
  
  .skin-container { display: flex; gap: 10px; margin-bottom: 25px; flex-wrap: wrap; justify-content: center; }
  .skin-card { width: 70px; height: 90px; background: rgba(255, 255, 255, 0.1); border: 2px solid rgba(255, 255, 255, 0.3); border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; color: #fff; font-size: 11px; font-weight: bold; }
  .skin-card.active { border-color: #ffeb3b; background: rgba(255, 235, 59, 0.2); box-shadow: 0 0 15px rgba(255, 235, 59, 0.5); }
  .skin-icon { width: 25px; height: 40px; border-radius: 6px; margin-bottom: 6px; }
  .icon-base { background: #777; }
  .icon-gold { background: linear-gradient(135deg, #ffd700, #b8860b); }
  .icon-cape { background: #777; position: relative; overflow: hidden; }
  .icon-cape::after { content: ''; position: absolute; bottom: 0; right: -5px; width: 15px; height: 25px; background: #d32f2f; transform: rotate(15deg); border-radius: 3px; }

  .map-container { display: flex; gap: 15px; margin-bottom: 30px; flex-wrap: wrap; justify-content: center; }
  .map-card { width: 120px; height: 80px; background: rgba(255, 255, 255, 0.1); border: 2px solid rgba(255, 255, 255, 0.3); border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; color: #fff; font-size: 13px; font-weight: bold; text-align: center; }
  .map-card.active { border-color: #4caf50; background: rgba(76, 175, 80, 0.2); box-shadow: 0 0 15px rgba(76, 175, 80, 0.5); }
  .map-desc { font-size: 10px; color: #ccc; font-weight: normal; margin-top: 5px; }
  .btn-play { padding: 15px 50px; font-size: 20px; font-weight: 900; color: #fff; text-transform: uppercase; letter-spacing: 2px; background: linear-gradient(135deg, #4caf50, #2e7d32); border: 3px solid rgba(255, 255, 255, 0.5); border-radius: 30px; cursor: pointer; box-shadow: 0 8px 20px rgba(0,0,0,0.3); }
  .btn-play:active { transform: scale(0.95); }

  /* --- ИГРОВОЙ ИНТЕРФЕЙС --- */
  .panel-left { position: absolute; left: 0; top: 0; bottom: 0; width: 25%; display: flex; flex-direction: column; border-right: 2px solid rgba(255, 255, 255, 0.3); }
  .panel-left .btn { flex: 1; display: flex; align-items: center; justify-content: center; background: rgba(255, 255, 255, 0.1); border-bottom: 2px solid rgba(255, 255, 255, 0.3); font-weight: bold; color: #fff; font-size: 14px; pointer-events: auto; cursor: pointer; }
  .panel-left .btn:active { background: rgba(255, 255, 255, 0.3); }
  .panel-right { position: absolute; right: 0; top: 0; bottom: 0; width: 25%; display: flex; flex-direction: column; border-left: 2px solid rgba(255, 255, 255, 0.3); }
  .panel-right .btn { flex: 1; display: flex; align-items: center; justify-content: center; background: rgba(255, 255, 255, 0.1); border-bottom: 2px solid rgba(255, 255, 255, 0.3); font-weight: bold; color: #fff; font-size: 14px; pointer-events: auto; cursor: pointer; }
  .panel-right .btn:active { background: rgba(255, 255, 255, 0.3); }
  .center-controls { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 20px; }
  .center-controls .btn { width: 60px; height: 60px; border-radius: 50%; background: rgba(255, 255, 255, 0.2); border: 2px solid rgba(255, 255, 255, 0.5); display: flex; align-items: center; justify-content: center; font-size: 24px; color: #fff; pointer-events: auto; cursor: pointer; }
  .center-controls .btn:active { background: rgba(255, 255, 255, 0.4); transform: scale(0.9); }

  #score-container { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); text-align: center; pointer-events: none; display: flex; flex-direction: column; align-items: center; }
  #score { font-size: 28px; font-weight: 900; color: #fff; text-shadow: 0 3px 6px rgba(0,0,0,0.4); }
  #combo { font-size: 12px; font-weight: 800; color: #ffeb3b; background: rgba(0,0,0,0.4); padding: 2px 8px; border-radius: 10px; opacity: 0; }
  #status { font-size: 11px; font-weight: 600; color: #fff; opacity: 0.9; margin-top: 4px; }
  #perfect-text { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%) scale(0); font-size: 36px; font-weight: 900; color: #ffeb3b; text-shadow: 0 0 20px #ff9800, 0 5px 10px rgba(0,0,0,0.5); opacity: 0; pointer-events: none; transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
  #perfect-text.show { transform: translate(-50%, -50%) scale(1); opacity: 1; }
</style>
</head>
<body>

<div id="menu-overlay">
  <div class="menu-title">ГИМНАСТИКА 3D</div>
  <div class="section-title">Скины</div>
  <div class="skin-container">
    <div class="skin-card" data-skin="base"><div class="skin-icon icon-base"></div>Серый</div>
    <div class="skin-card" data-skin="gold"><div class="skin-icon icon-gold"></div>Золотой</div>
    <div class="skin-card" data-skin="cape"><div class="skin-icon icon-cape"></div>Плащ</div>
  </div>
  <div class="section-title">Карты</div>
  <div class="map-container">
    <div class="map-card active" data-map="training">Тренировка<div class="map-desc">Батуты и стены</div></div>
    <div class="map-card" data-map="obstacle">Полоса<div class="map-desc">Шипы и высоты</div></div>
    <div class="map-card" data-map="hardcore">Хардкор<div class="map-desc">Высоко и опасно</div></div>
  </div>
  <button class="btn-play" id="btn-play">ИГРАТЬ</button>
</div>

<div id="ui">
  <div id="score-container">
    <div id="score">0</div>
    <div id="combo">COMBO x2</div>
    <div id="status">Схватись за турник</div>
  </div>
  <div id="perfect-text">PERFECT!</div>

  <div class="panel-left">
    <div class="btn" id="btn-left">ВЛЕВО<br>◀</div>
    <div class="btn" id="btn-twist">TWIST</div>
  </div>
  <div class="panel-right">
    <div class="btn" id="btn-tuck">TUCK</div>
    <div class="btn" id="btn-arch">ARCH</div>
    <div class="btn" id="btn-layout">LAYOUT</div>
    <div class="btn" id="btn-release">ОТПУСТИТЬ<br>▲</div>
  </div>
  <div class="center-controls">
    <div class="btn" id="btn-right">▶</div>
    <div class="btn" id="btn-spin">SPIN<br>🌀</div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

// --- Сцена ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x71bce8);
scene.fog = new THREE.Fog(0x71bce8, 30, 100);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 200);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// --- Свет ---
scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 0.8));
const sun = new THREE.DirectionalLight(0xfff5e6, 1.5);
sun.position.set(15, 30, 15); sun.castShadow = true;
sun.shadow.mapSize.width = 1024; sun.shadow.mapSize.height = 1024; sun.shadow.bias = -0.0005;
scene.add(sun);

// --- Материалы ---
const floorMat = new THREE.MeshStandardMaterial({ color: 0xb32222, roughness: 0.8 });
const wallMat = new THREE.MeshStandardMaterial({ color: 0x881111, roughness: 0.9 }); 
const spikeMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.9 });
const trampolineMat = new THREE.MeshStandardMaterial({ color: 0x222266, roughness: 0.5, metalness: 0.5 });
const metalMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.9, roughness: 0.2 });
const matBase = new THREE.MeshStandardMaterial({ color: 0x888888, roughness: 0.6 });
const matGold = new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 1.0, roughness: 0.2 });
const matCape = new THREE.MeshStandardMaterial({ color: 0xd32f2f, roughness: 0.8, side: THREE.DoubleSide });

// --- Карта ---
const levelGroup = new THREE.Group(); scene.add(levelGroup);
const bars = []; const spikeZones = []; const trampolines = [];
let minX = -50; let maxX = 50; // Глобальные границы (коллизии)

function clearLevel() {
  while(levelGroup.children.length > 0){ levelGroup.remove(levelGroup.children[0]); }
  bars.length = 0; spikeZones.length = 0; trampolines.length = 0;
}

function generateMap(mapType) {
  clearLevel();
  
  const arenaLength = 160;
  minX = -arenaLength/2 + 2; // Оставляем место для персонажа (радиус)
  maxX = arenaLength/2 - 2;
  
  // Пол
  const ground = new THREE.Mesh(new THREE.BoxGeometry(arenaLength, 2, 10), floorMat);
  ground.position.set(0, -1, 0); ground.receiveShadow = true; levelGroup.add(ground);

  // Задняя стена (декорация)
  const backWall = new THREE.Mesh(new THREE.BoxGeometry(arenaLength, 40, 2), wallMat);
  backWall.position.set(0, 19, -10); backWall.receiveShadow = true; levelGroup.add(backWall);

  // Боковые стены (визуальные границы)
  const leftWall = new THREE.Mesh(new THREE.BoxGeometry(2, 40, 20), wallMat);
  leftWall.position.set(-arenaLength/2, 19, 0); levelGroup.add(leftWall);
  
  const rightWall = new THREE.Mesh(new THREE.BoxGeometry(2, 40, 20), wallMat);
  rightWall.position.set(arenaLength/2, 19, 0); levelGroup.add(rightWall);

  let currentX = -60; // Начинаем чуть дальше
  let currentHeight = 4.5;

  for (let i = 0; i < 25; i++) {
    let barLen = 2.0;
    let type = 'normal';

    if (mapType === 'obstacle') {
      currentHeight += (Math.random() - 0.5) * 3;
      if (currentHeight < 3.5) currentHeight = 3.5;
      if (currentHeight > 9) currentHeight = 9;
      barLen = 1.5 + Math.random() * 1.5;
      if (Math.random() > 0.7) type = 'trampoline';
      if (Math.random() > 0.6) type = 'spikes';
    } else if (mapType === 'hardcore') {
      currentHeight += (Math.random() - 0.5) * 5;
      if (currentHeight < 5) currentHeight = 5;
      if (currentHeight > 14) currentHeight = 14;
      barLen = 1.0 + Math.random() * 1.0;
      if (Math.random() > 0.5) type = 'spikes';
    } else { currentHeight = 4.5; if (Math.random() > 0.6) type = 'trampoline'; }

    if (type === 'normal' || type === 'spikes') {
      const group = new THREE.Group();
      [-1, 1].forEach(dz => {
        const post = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, currentHeight, 8), metalMat);
        post.position.set(0, currentHeight/2, dz); post.castShadow = true; group.add(post);
      });
      const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, barLen, 8), metalMat);
      bar.rotation.x = Math.PI / 2; bar.position.y = currentHeight; bar.castShadow = true; group.add(bar);
      group.position.x = currentX; levelGroup.add(group);
      bars.push({ x: currentX, y: currentHeight });
    } else if (type === 'trampoline') {
      const tramp = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 1.5, 0.4, 16), trampolineMat);
      tramp.position.set(currentX, 0.2, 0); tramp.receiveShadow = true; levelGroup.add(tramp);
      trampolines.push({ x: currentX });
    }

    if (type === 'spikes' && mapType !== 'training') {
      const spike = new THREE.Mesh(new THREE.BoxGeometry(3, 0.5, 10), spikeMat);
      spike.position.set(currentX + 4, 0.25, 0); spike.receiveShadow = true; levelGroup.add(spike);
      spikeZones.push(currentX + 4);
    }

    let gap = 7 + Math.random() * 2;
    if (mapType === 'hardcore') gap = 9 + Math.random() * 3;
    currentX += gap;
  }

  // Настенные турники
  for (let i = 0; i < 15; i++) {
    const wx = -60 + i * 15;
    const wy = 8 + Math.random() * 5; 
    const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 2.0, 8), metalMat);
    bar.rotation.x = Math.PI / 2; bar.position.set(wx, wy, -8); bar.castShadow = true;
    levelGroup.add(bar);
    bars.push({ x: wx, y: wy });
  }
}

// --- Человечек ---
const playerGroup = new THREE.Group(); 
const bodyGroup = new THREE.Group();   
playerGroup.add(bodyGroup); playerGroup.rotation.y = Math.PI / 2; 

const torso = new THREE.Mesh(new THREE.CapsuleGeometry(0.2, 1.0, 4, 8), matBase);
torso.position.y = 0.8; torso.castShadow = true; bodyGroup.add(torso);
const head = new THREE.Mesh(new THREE.SphereGeometry(0.2, 16, 16), matBase);
head.position.set(0, 1.6, 0); head.castShadow = true; bodyGroup.add(head);

function createLimb(r, l, x, y) {
  const pivot = new THREE.Group(); pivot.position.set(x, y, 0);
  const limb = new THREE.Mesh(new THREE.CapsuleGeometry(r, l, 4, 8), matBase);
  limb.position.y = -l / 2; limb.castShadow = true; pivot.add(limb); bodyGroup.add(pivot); return pivot;
}

const leftArm = createLimb(0.07, 0.9, -0.3, 1.3);
const rightArm = createLimb(0.07, 0.9, 0.3, 1.3);
const leftLeg = createLimb(0.08, 1.1, -0.15, 0.4);
const rightLeg = createLimb(0.08, 1.1, 0.15, 0.4);

const capeGeo = new THREE.PlaneGeometry(0.8, 1.4, 4, 4);
const cape = new THREE.Mesh(capeGeo, matCape);
cape.position.set(0, 0.9, -0.25); cape.castShadow = true; cape.visible = false; bodyGroup.add(cape);

const allMeshes = [torso, head, leftArm.children[0], rightArm.children[0], leftLeg.children[0], rightLeg.children[0]];
scene.add(playerGroup);

// Скины
let currentSkin = localStorage.getItem('gym_skin') || 'base';
function applySkin(skinName) {
  currentSkin = skinName; localStorage.setItem('gym_skin', skinName);
  cape.visible = false; allMeshes.forEach(mesh => mesh.material = matBase);
  if (skinName === 'gold') { allMeshes.forEach(mesh => mesh.material = matGold); } 
  else if (skinName === 'cape') { cape.visible = true; }
  document.querySelectorAll('.skin-card').forEach(el => el.classList.remove('active'));
  const activeCard = document.querySelector(`[data-skin="${skinName}"]`);
  if (activeCard) activeCard.classList.add('active');
}
document.querySelectorAll('.skin-card').forEach(card => {
  card.addEventListener('click', (e) => { e.preventDefault(); applySkin(card.dataset.skin); });
});
applySkin(currentSkin);

// Карты
let currentMap = 'training';
function selectMap(mapType) {
  currentMap = mapType;
  document.querySelectorAll('.map-card').forEach(el => el.classList.remove('active'));
  const activeCard = document.querySelector(`[data-map="${mapType}"]`);
  if (activeCard) activeCard.classList.add('active');
}
document.querySelectorAll('.map-card').forEach(card => {
  card.addEventListener('click', (e) => { e.preventDefault(); selectMap(card.dataset.map); });
});

// --- VFX ---
const trailPositions = new Float32Array(20 * 3);
const trailGeo = new THREE.BufferGeometry();
trailGeo.setAttribute('position', new THREE.BufferAttribute(trailPositions, 3));
const trailLine = new THREE.Line(trailGeo, new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.6 }));
scene.add(trailLine); let trailIndex = 0;

const particleCount = 30;
const particleGeo = new THREE.BufferGeometry();
const particlePositions = new Float32Array(particleCount * 3);
particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
const particleMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.4, transparent: true, opacity: 0.8 });
const particles = new THREE.Points(particleGeo, particleMat); scene.add(particles);
let particleVelocity = []; let particleTimer = 0;

function spawnParticles(x, y) {
  particleTimer = 0.5;
  const pos = particles.geometry.attributes.position.array;
  for (let i = 0; i < particleCount; i++) {
    pos[i*3] = x; pos[i*3+1] = y; pos[i*3+2] = 0;
    particleVelocity.push({ x: (Math.random() - 0.5) * 8, y: (Math.random() - 0.5) * 8 });
  }
  particles.geometry.attributes.position.needsUpdate = true;
}

// --- ФИЗИКА ---
let state = 'air', velocityX = 0, velocityY = 0, rotationSpeed = 0, currentPose = 'layout', isSticking = false;
let swingAngle = 0, swingVelocity = 0, swingDirection = 1, currentBar = null, grabCooldown = 0, isUnwinding = false;
let score = 0, combo = 1, isComboActive = false, lastRotationAngle = 0, perfectMultiplier = 1;

let targetPoseValues = { armX: 0, legX: 0, torsoX: 0 };

const GRAVITY = -25, JUMP_FORCE = 15, MAX_SWING_SPEED = 18, FEET_OFFSET = 0.7, AIR_CONTROL = 15;
let inputLeft = false, inputRight = false;

// Стартовая позиция сдвинута влево
const startPos = new THREE.Vector3(-40, 7, 0); 
const keys = {};
addEventListener('keydown', e => keys[e.code] = true);
addEventListener('keyup', e => keys[e.code] = false);

const scoreEl = document.getElementById('score'), comboEl = document.getElementById('combo'), statusEl = document.getElementById('status'), perfectEl = document.getElementById('perfect-text');

function updateUI(statusText) {
  statusEl.innerHTML = statusText; scoreEl.textContent = score;
  if (combo > 1) { comboEl.textContent = `COMBO x${combo}`; comboEl.style.opacity = 1; } else { comboEl.style.opacity = 0; }
}
function addScore(amount) { score += amount * combo * perfectMultiplier; scoreEl.textContent = score; }
function breakCombo() { combo = 1; isComboActive = false; perfectMultiplier = 1; comboEl.style.opacity = 0; }
function showPerfect() { perfectEl.classList.add('show'); setTimeout(() => perfectEl.classList.remove('show'), 600); perfectMultiplier = 2; }

function resetPlayer() {
  playerGroup.position.copy(startPos); bodyGroup.rotation.set(0, 0, 0);
  velocityX = 6; velocityY = 0; rotationSpeed = -3; state = 'air'; grabCooldown = 0.5;
  breakCombo(); updateUI("Схватись за турник");
}

// Управление
function bindBtn(id, downFn, upFn) {
  const el = document.getElementById(id);
  if(!el) return;
  el.addEventListener('pointerdown', (e) => { e.preventDefault(); downFn(); });
  el.addEventListener('pointerup', (e) => { e.preventDefault(); if(upFn) upFn(); });
  el.addEventListener('pointerleave', (e) => { e.preventDefault(); if(upFn) upFn(); });
  el.addEventListener('pointercancel', (e) => { e.preventDefault(); if(upFn) upFn(); });
}

bindBtn('btn-left', () => inputLeft = true, () => inputLeft = false);
bindBtn('btn-right', () => inputRight = true, () => inputRight = false);

bindBtn('btn-spin', () => {
  isUnwinding = true;
  if (state === 'hanging') { currentPose = 'layout'; updateUI("Раскрутка! 🌀"); }
  else if (state === 'air') { rotationSpeed -= 5; } 
}, () => isUnwinding = false);

bindBtn('btn-release', () => {
  if (state === 'air') { velocityY = -30; velocityX *= 1.5; updateUI("Ударная волна! 💥"); } 
  else { actionButton(); }
});

bindBtn('btn-tuck', () => {
  if (state === 'air') { currentPose = 'tuck'; rotationSpeed *= 1.5; velocityY -= 1.5; }
});
bindBtn('btn-arch', () => {
  if (state === 'air') { currentPose = 'arch'; rotationSpeed *= 0.7; velocityY += 1.5; }
});
bindBtn('btn-layout', () => {
  if (state === 'air') { currentPose = 'layout'; }
});
bindBtn('btn-twist', () => {
  if (state === 'air') { bodyGroup.rotation.y += Math.PI; } 
});

function actionButton() {
  if (state === 'hanging') {
    state = 'air'; grabCooldown = 0.6; 
    if (Math.abs(swingVelocity) > MAX_SWING_SPEED * 0.8 && Math.abs(swingAngle) > 0.5) { showPerfect(); } else { perfectMultiplier = 1; }
    
    velocityX = Math.cos(swingAngle) * swingVelocity * 0.9; 
    velocityY = Math.sin(swingAngle) * swingVelocity * 0.9;
    if (Math.abs(velocityX) < 3) velocityX = 3 * swingDirection;
    
    rotationSpeed = swingVelocity * 0.3; 
    isSticking = false;
    updateUI("В полете!");
  } else if (state === 'grounded') {
    state = 'air'; velocityY = JUMP_FORCE; velocityX = 6; rotationSpeed = -4; grabCooldown = 0.2;
  }
}

renderer.domElement.addEventListener('pointerdown', actionButton);
addEventListener('keydown', e => { 
  if (e.code === 'Space') actionButton(); 
  if (e.code === 'ArrowDown' || e.code === 'KeyS') { if (state === 'air') { velocityY = -30; velocityX *= 1.5; } }
});

// --- ЦИКЛ ---
const clock = new THREE.Clock();
let isPlaying = false;

document.getElementById('btn-play').addEventListener('click', () => {
  document.getElementById('menu-overlay').classList.add('hidden');
  isPlaying = true; generateMap(currentMap); resetPlayer();
});

generateMap('training');

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05); 

  if (!isPlaying) {
    const time = clock.getElapsedTime();
    camera.position.x = Math.sin(time * 0.3) * 30; camera.position.z = Math.cos(time * 0.3) * 30;
    camera.position.y = 10; camera.lookAt(0, 4, 0);
    if (currentSkin === 'cape') cape.rotation.x = Math.sin(time * 5) * 0.1;
    renderer.render(scene, camera); return;
  }

  if (grabCooldown > 0) grabCooldown -= dt;

  if (state === 'air') {
    let moveDir = 0;
    if (keys['KeyA'] || keys['ArrowLeft'] || inputLeft) moveDir -= 1;
    if (keys['KeyD'] || keys['ArrowRight'] || inputRight) moveDir += 1;
    velocityX += moveDir * AIR_CONTROL * dt;
  }

  // --- ФИЗИКА ---
  if (state === 'air') {
    velocityY += GRAVITY * dt;
    playerGroup.position.x += velocityX * dt;
    playerGroup.position.y += velocityY * dt;

    // КОЛЛИЗИИ СТЕН (Исправлено)
    if (playerGroup.position.x < minX) {
      playerGroup.position.x = minX;
      velocityX = Math.abs(velocityX) * 0.5; // Отскок вправо
      rotationSpeed *= -0.5; // Меняем вращение
      spawnParticles(playerGroup.position.x, playerGroup.position.y);
    } else if (playerGroup.position.x > maxX) {
      playerGroup.position.x = maxX;
      velocityX = -Math.abs(velocityX) * 0.5; // Отскок влево
      rotationSpeed *= -0.5;
      spawnParticles(playerGroup.position.x, playerGroup.position.y);
    }

    if (!isSticking) {
      bodyGroup.rotation.x += rotationSpeed * dt;
      const currentAngle = bodyGroup.rotation.x;
      if (Math.abs(currentAngle - lastRotationAngle) > Math.PI * 2) {
        lastRotationAngle = currentAngle;
        addScore(100 * Math.floor(Math.abs(rotationSpeed) / 2)); isComboActive = true;
      }
    }

    if (velocityY < 0) {
      for (let t of trampolines) {
        if (Math.abs(playerGroup.position.x - t.x) < 1.5 && playerGroup.position.y <= 1.5) {
          velocityY = 25; addScore(50); updateUI("Батут! 🚀"); spawnParticles(t.x, 0.5); break;
        }
      }
    }

    if (playerGroup.position.y <= 0.5 + FEET_OFFSET) {
      const hitSpike = spikeZones.some(sx => Math.abs(playerGroup.position.x - sx) < 3.5);
      if (hitSpike) { velocityY = 20; velocityX = -velocityX * 0.5; breakCombo(); updateUI("Шипы! 💀"); spawnParticles(playerGroup.position.x, playerGroup.position.y); }
    }

    if (grabCooldown <= 0) {
      const handY = playerGroup.position.y + 1.6; 
      for (let p of bars) {
        const distX = Math.abs(playerGroup.position.x - p.x);
        if (distX > 1.5) continue;
        if (Math.abs(handY - p.y) < 0.8 && velocityY < 0) { 
          state = 'hanging'; currentBar = p; playerGroup.position.x = p.x; playerGroup.position.y = p.y - 1.7;
          swingVelocity = velocityX * 0.3; swingDirection = velocityX >= 0 ? 1 : -1; swingAngle = swingDirection === 1 ? -0.3 : 0.3; 
          velocityX = 0; velocityY = 0; 
          bodyGroup.rotation.x = -swingAngle;
          lastRotationAngle = 0;
          if (isComboActive) { combo++; addScore(500); updateUI("Комбо x" + combo); } else { addScore(50); updateUI("Схватился!"); }
          spawnParticles(p.x, p.y); break;
        }
      }
    }

    if (playerGroup.position.y <= FEET_OFFSET && state === 'air') {
      const hitSpike = spikeZones.some(sx => Math.abs(playerGroup.position.x - sx) < 3.5);
      if (!hitSpike) {
        playerGroup.position.y = FEET_OFFSET; state = 'grounded'; bodyGroup.rotation.x = 0;
        velocityX = 0; velocityY = 0; updateUI("На мате"); spawnParticles(playerGroup.position.x, playerGroup.position.y);
      }
    }
  } 
  else if (state === 'hanging') {
    if (isUnwinding) { swingVelocity += 15 * dt * swingDirection; if (Math.abs(swingVelocity) > MAX_SWING_SPEED) swingVelocity = MAX_SWING_SPEED * swingDirection; }
    const gravityEffect = -(GRAVITY / 1.7) * Math.sin(swingAngle);
    swingVelocity += gravityEffect * dt; swingVelocity *= 0.99; swingAngle += swingVelocity * dt;
    playerGroup.position.x = currentBar.x + Math.sin(swingAngle) * 1.7;
    playerGroup.position.y = currentBar.y - Math.cos(swingAngle) * 1.7;
    bodyGroup.rotation.x = -swingAngle;
  }

  // VFX
  const posAttr = trailGeo.attributes.position.array;
  posAttr[trailIndex * 3] = playerGroup.position.x; posAttr[trailIndex * 3 + 1] = playerGroup.position.y + 1.0; posAttr[trailIndex * 3 + 2] = 0;
  trailIndex = (trailIndex + 1) % 20; trailGeo.attributes.position.needsUpdate = true;
  const speed = Math.abs(velocityX) + Math.abs(velocityY) + Math.abs(rotationSpeed);
  trailLine.material.opacity = Math.min(speed * 0.02, 0.7);

  if (particleTimer > 0) {
    particleTimer -= dt; const pPos = particles.geometry.attributes.position.array;
    for (let i = 0; i < particleCount; i++) { pPos[i*3] += particleVelocity[i].x * dt; pPos[i*3+1] += particleVelocity[i].y * dt; }
    particles.geometry.attributes.position.needsUpdate = true; particleMat.opacity = particleTimer * 2; 
  } else { particleMat.opacity = 0; }

  // ПЛАВНАЯ АНИМАЦИЯ
  if (state === 'hanging') {
    targetPoseValues.armX = Math.PI;
    targetPoseValues.legX = 0.2 + swingVelocity * 0.1;
  } else if (state === 'air') {
    if (currentPose === 'tuck') {
      targetPoseValues.armX = -Math.PI / 2;
      targetPoseValues.legX = -Math.PI / 1.5;
    } else if (currentPose === 'arch') {
      targetPoseValues.armX = -0.5;
      targetPoseValues.legX = 0.5;
    } else {
      let legSwing = 0; if (inputLeft) legSwing = 0.5; if (inputRight) legSwing = -0.5;
      targetPoseValues.armX = Math.PI;
      targetPoseValues.legX = legSwing;
    }
  } else {
    targetPoseValues.armX = 0;
    targetPoseValues.legX = 0;
  }

  const lerpSpeed = 8 * dt;
  leftArm.rotation.x = THREE.MathUtils.lerp(leftArm.rotation.x, targetPoseValues.armX, lerpSpeed);
  rightArm.rotation.x = THREE.MathUtils.lerp(rightArm.rotation.x, targetPoseValues.armX, lerpSpeed);
  leftLeg.rotation.x = THREE.MathUtils.lerp(leftLeg.rotation.x, targetPoseValues.legX, lerpSpeed);
  rightLeg.rotation.x = THREE.MathUtils.lerp(rightLeg.rotation.x, -targetPoseValues.legX, lerpSpeed);

  if (currentSkin === 'cape') {
    const speed = Math.abs(velocityX) + Math.abs(velocityY) + Math.abs(rotationSpeed);
    const targetRot = Math.min(speed * 0.05, 1.2); cape.rotation.x = THREE.MathUtils.lerp(cape.rotation.x, targetRot, 0.1);
  }

  const targetCamX = playerGroup.position.x;
  camera.position.x = THREE.MathUtils.lerp(camera.position.x, targetCamX, 5 * dt);
  camera.position.y = 6.0; camera.position.z = 20; camera.lookAt(camera.position.x, playerGroup.position.y + 1.0, 0);

  renderer.render(scene, camera);
}

resetPlayer();
animate();
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
