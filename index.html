<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Гимнастика 3D - Скины (Исправлено)</title>
<style>
  body { margin: 0; overflow: hidden; background: #87CEEB; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; touch-action: none; -webkit-user-select: none; }
  canvas { display: block; }
  #ui { position: absolute; inset: 0; pointer-events: none; }

  /* --- Меню --- */
  #menu-overlay {
    position: absolute; inset: 0; background: rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    pointer-events: auto; z-index: 100;
    transition: opacity 0.3s ease;
  }
  #menu-overlay.hidden { opacity: 0; pointer-events: none; }
  
  .menu-title {
    font-size: 42px; font-weight: 900; color: #fff;
    text-shadow: 0 5px 15px rgba(0,0,0,0.5); margin-bottom: 30px;
    text-transform: uppercase; letter-spacing: 2px;
  }

  .skin-container {
    display: flex; gap: 15px; margin-bottom: 40px; flex-wrap: wrap; justify-content: center;
  }
  
  .skin-card {
    width: 100px; height: 120px;
    background: rgba(255, 255, 255, 0.1);
    border: 2px solid rgba(255, 255, 255, 0.3);
    border-radius: 16px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; cursor: pointer;
    transition: all 0.2s ease; color: #fff; font-weight: bold;
  }
  .skin-card:hover { background: rgba(255, 255, 255, 0.2); }
  .skin-card.active { border-color: #ffeb3b; background: rgba(255, 235, 59, 0.2); box-shadow: 0 0 15px rgba(255, 235, 59, 0.5); }
  
  .skin-icon {
    width: 40px; height: 60px; border-radius: 10px; margin-bottom: 10px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  }
  .icon-base { background: #2a2a2a; }
  .icon-gold { background: linear-gradient(135deg, #ffd700, #b8860b); }
  .icon-cape { background: #2a2a2a; position: relative; overflow: hidden; }
  .icon-cape::after { content: ''; position: absolute; bottom: 0; right: -5px; width: 25px; height: 40px; background: #d32f2f; transform: rotate(15deg); border-radius: 5px; }

  .btn-play {
    padding: 18px 60px; font-size: 24px; font-weight: 900;
    color: #fff; text-transform: uppercase; letter-spacing: 2px;
    background: linear-gradient(135deg, #4caf50, #2e7d32);
    border: 3px solid rgba(255, 255, 255, 0.5); border-radius: 30px;
    cursor: pointer; box-shadow: 0 10px 20px rgba(0,0,0,0.3);
    transition: all 0.1s ease;
  }
  .btn-play:active { transform: scale(0.95); box-shadow: 0 5px 10px rgba(0,0,0,0.3); }

  /* --- Игровые кнопки --- */
  .glass-btn {
    position: absolute; display: flex; align-items: center; justify-content: center;
    font-weight: 800; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 2px solid rgba(255, 255, 255, 0.4); box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    pointer-events: auto; cursor: pointer; transition: all 0.1s ease;
  }
  .glass-btn:active { transform: scale(0.9); background: rgba(255, 255, 255, 0.4); }

  .move-btn { bottom: 30px; width: 80px; height: 80px; border-radius: 50%; font-size: 30px; }
  #btn-left { left: 20px; }
  #btn-right { left: 115px; }

  #btn-release {
    bottom: 30px; right: 20px; width: 110px; height: 110px; border-radius: 50%;
    font-size: 18px; flex-direction: column; line-height: 1.2;
    background: rgba(100, 255, 100, 0.2); border-color: rgba(100, 255, 100, 0.6);
  }
  #btn-release:active { background: rgba(100, 255, 100, 0.5); }

  #btn-spin {
    bottom: 155px; right: 35px; width: 80px; height: 80px; border-radius: 50%;
    font-size: 14px; flex-direction: column;
    background: rgba(255, 150, 0, 0.2); border-color: rgba(255, 150, 0, 0.6);
  }
  #btn-spin:active { background: rgba(255, 150, 0, 0.5); }

  .col-right { position: absolute; top: 15%; right: 15px; display: flex; flex-direction: column; gap: 10px; }
  .col-right .glass-btn { position: relative; width: 85px; height: 45px; border-radius: 12px; font-size: 13px; }

  #score-container {
    position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
    text-align: center; pointer-events: none;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
  }
  #score { font-size: 32px; font-weight: 900; color: #fff; text-shadow: 0 3px 6px rgba(0,0,0,0.4); }
  #combo { font-size: 14px; font-weight: 800; color: #ffeb3b; background: rgba(0,0,0,0.4); padding: 2px 10px; border-radius: 10px; opacity: 0; transition: opacity 0.2s; }
  #status { font-size: 13px; font-weight: 600; color: #fff; opacity: 0.9; text-shadow: 0 1px 3px #000; margin-top: 4px; }
  
  #perfect-text {
    position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%) scale(0);
    font-size: 50px; font-weight: 900; color: #ffeb3b;
    text-shadow: 0 0 20px #ff9800, 0 5px 10px rgba(0,0,0,0.5);
    opacity: 0; pointer-events: none; transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  #perfect-text.show { transform: translate(-50%, -50%) scale(1); opacity: 1; }
</style>
</head>
<body>

<!-- МЕНЮ -->
<div id="menu-overlay">
  <div class="menu-title">ГИМНАСТИКА 3D</div>
  
  <div class="skin-container">
    <div class="skin-card" data-skin="base">
      <div class="skin-icon icon-base"></div>
      Базовый
    </div>
    <div class="skin-card" data-skin="gold">
      <div class="skin-icon icon-gold"></div>
      Золотой
    </div>
    <div class="skin-card" data-skin="cape">
      <div class="skin-icon icon-cape"></div>
      Плащ
    </div>
  </div>

  <button class="btn-play" id="btn-play">ИГРАТЬ</button>
</div>

<!-- ИГРОВОЙ ИНТЕРФЕЙС -->
<div id="ui">
  <div id="score-container">
    <div id="score">0</div>
    <div id="combo">COMBO x2</div>
    <div id="status">Схватись за турник</div>
  </div>
  
  <div id="perfect-text">PERFECT!</div>

  <div class="glass-btn move-btn" id="btn-left">◀</div>
  <div class="glass-btn move-btn" id="btn-right">▶</div>

  <div class="col-right">
    <div class="glass-btn" id="btn-tuck">TUCK</div>
    <div class="glass-btn" id="btn-arch">ARCH</div>
    <div class="glass-btn" id="btn-layout">LAYOUT</div>
    <div class="glass-btn" id="btn-stick">STICK</div>
  </div>

  <div class="glass-btn" id="btn-spin">SPIN<br>🌀</div>
  <div class="glass-btn" id="btn-release">ОТПУСТИТЬ<br>▲</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

// --- Сцена и Графика ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x71bce8);
scene.fog = new THREE.Fog(0x71bce8, 40, 100);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 200);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// --- Свет ---
const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.6);
scene.add(hemiLight);
const sun = new THREE.DirectionalLight(0xfff5e6, 1.5);
sun.position.set(15, 30, 15);
sun.castShadow = true;
sun.shadow.mapSize.width = 2048; sun.shadow.mapSize.height = 2048;
sun.shadow.bias = -0.0005;
scene.add(sun);

// --- Материалы Карты ---
function createBrickTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 256; canvas.height = 256;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#801010'; ctx.fillRect(0, 0, 256, 256);
  ctx.fillStyle = '#b32222'; const bw = 64, bh = 32, gap = 4;
  for (let y = 0; y < 256; y += bh + gap) {
    const offset = (y / (bh + gap)) % 2 === 0 ? 0 : -(bw + gap) / 2;
    for (let x = offset; x < 256; x += bw + gap) {
      ctx.fillRect(x, y, bw, bh);
      ctx.fillStyle = 'rgba(255,255,255,0.1)'; ctx.fillRect(x, y, bw, 3); ctx.fillStyle = '#b32222';
    }
  }
  const tex = new THREE.CanvasTexture(canvas);
  tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(10, 5);
  return tex;
}

const floorMat = new THREE.MeshStandardMaterial({ color: 0xb32222, roughness: 0.8 });
const spikeMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.9 });
const wallMat = new THREE.MeshStandardMaterial({ map: createBrickTexture(), roughness: 0.9 });
const metalMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.9, roughness: 0.2 });

// --- Карта ---
const mapWidth = 64;
const wallHeight = 16;

const groundBox = new THREE.Mesh(new THREE.BoxGeometry(mapWidth, 2, 6), floorMat);
groundBox.position.set(0, -1, 0);
groundBox.receiveShadow = true;
scene.add(groundBox);

const spikeZones = [-12, 12];
spikeZones.forEach(x => {
  const spike = new THREE.Mesh(new THREE.BoxGeometry(4, 0.5, 6), spikeMat);
  spike.position.set(x, 0.25, 0);
  spike.receiveShadow = true; spike.castShadow = true;
  scene.add(spike);
});

function createWall(x, z, w, d) {
  const wall = new THREE.Mesh(new THREE.BoxGeometry(w, wallHeight, d), wallMat);
  wall.position.set(x, wallHeight/2 - 1, z);
  wall.receiveShadow = true; wall.castShadow = true;
  scene.add(wall);
}
createWall(-mapWidth/2 + 1, 0, 2, 6); 
createWall(mapWidth/2 - 1, 0, 2, 6);  
createWall(0, -3, mapWidth, 1);       

const minX = -mapWidth/2 + 2.5;
const maxX = mapWidth/2 - 2.5;

// --- Турники ---
const bars = []; 
const floorBarsY = 4.5;
for (let i = -3; i <= 3; i++) {
  const x = i * 8;
  const group = new THREE.Group();
  const postGeo = new THREE.CylinderGeometry(0.08, 0.08, floorBarsY, 8);
  [-1, 1].forEach(dz => {
    const post = new THREE.Mesh(postGeo, metalMat);
    post.position.set(0, floorBarsY/2, dz); post.castShadow = true; group.add(post);
  });
  const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 2.5, 16), metalMat);
  bar.rotation.x = Math.PI / 2; bar.position.y = floorBarsY; bar.castShadow = true; group.add(bar);
  group.position.x = x; scene.add(group);
  bars.push({ x: x, y: floorBarsY });
}

[7.5, 10.5, 13.5].forEach(y => {
  [-20, -12, -4, 4, 12, 20].forEach(x => {
    const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 2.0, 16), metalMat);
    bar.rotation.x = Math.PI / 2; bar.position.set(x, y, -2.0); bar.castShadow = true;
    scene.add(bar);
    bars.push({ x: x, y: y });
  });
});

// ==========================================
// --- ЧЕЛОВЕЧЕК И СКИНЫ ---
// ==========================================
const playerGroup = new THREE.Group(); 
const bodyGroup = new THREE.Group();   
playerGroup.add(bodyGroup);
playerGroup.rotation.y = Math.PI / 2; 

// Материалы для скинов
const matBase = new THREE.MeshStandardMaterial({ color: 0x2a2a2a, roughness: 0.7 });
const matGold = new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 1.0, roughness: 0.2 });
const matCape = new THREE.MeshStandardMaterial({ color: 0xd32f2f, roughness: 0.8, side: THREE.DoubleSide });

// Создаем меши
const torso = new THREE.Mesh(new THREE.CapsuleGeometry(0.2, 1.0, 4, 8), matBase);
torso.position.y = 0.8; torso.castShadow = true; bodyGroup.add(torso);
const head = new THREE.Mesh(new THREE.SphereGeometry(0.2, 16, 16), matBase);
head.position.set(0, 1.6, 0); head.castShadow = true; bodyGroup.add(head);

function createLimb(r, l, x, y) {
  const pivot = new THREE.Group();
  pivot.position.set(x, y, 0);
  const limb = new THREE.Mesh(new THREE.CapsuleGeometry(r, l, 4, 8), matBase);
  limb.position.y = -l / 2; limb.castShadow = true;
  pivot.add(limb); bodyGroup.add(pivot);
  return pivot;
}

const leftArm = createLimb(0.07, 0.9, -0.3, 1.3);
const rightArm = createLimb(0.07, 0.9, 0.3, 1.3);
const leftLeg = createLimb(0.08, 1.1, -0.15, 0.4);
const rightLeg = createLimb(0.08, 1.1, 0.15, 0.4);

// Плащ (создаем как плоскость с сегментами для анимации)
const capeGeo = new THREE.PlaneGeometry(0.8, 1.4, 4, 4);
const cape = new THREE.Mesh(capeGeo, matCape);
cape.position.set(0, 0.9, -0.25); 
cape.castShadow = true;
cape.visible = false;
bodyGroup.add(cape);

// Все меши для смены цвета
const allMeshes = [torso, head, leftArm.children[0], rightArm.children[0], leftLeg.children[0], rightLeg.children[0]];
scene.add(playerGroup);

// Логика скинов
let currentSkin = localStorage.getItem('gym_skin') || 'base';

function applySkin(skinName) {
  currentSkin = skinName;
  localStorage.setItem('gym_skin', skinName);
  
  // Сброс
  cape.visible = false;
  allMeshes.forEach(mesh => mesh.material = matBase);

  if (skinName === 'gold') {
    allMeshes.forEach(mesh => mesh.material = matGold);
  } else if (skinName === 'cape') {
    cape.visible = true;
  }

  // Обновить UI меню
  document.querySelectorAll('.skin-card').forEach(el => el.classList.remove('active'));
  const activeCard = document.querySelector(`[data-skin="${skinName}"]`);
  if (activeCard) activeCard.classList.add('active');
}

// Навешиваем события на карточки
document.querySelectorAll('.skin-card').forEach(card => {
  card.addEventListener('click', (e) => {
    e.preventDefault(); // Предотвращаем скрытие меню
    applySkin(card.dataset.skin);
  });
});

// Применяем сохраненный скин при старте
applySkin(currentSkin);

// --- VFX ---
const trailLength = 20;
const trailPositions = new Float32Array(trailLength * 3);
const trailGeo = new THREE.BufferGeometry();
trailGeo.setAttribute('position', new THREE.BufferAttribute(trailPositions, 3));
const trailLine = new THREE.Line(trailGeo, new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.6 }));
scene.add(trailLine);
let trailIndex = 0;

const particleCount = 40;
const particleGeo = new THREE.BufferGeometry();
const particlePositions = new Float32Array(particleCount * 3);
particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
const particleMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.4, transparent: true, opacity: 0.8 });
const particles = new THREE.Points(particleGeo, particleMat);
scene.add(particles);
let particleVelocity = [];
let particleTimer = 0;

function spawnParticles(x, y) {
  particleTimer = 0.6;
  const pos = particles.geometry.attributes.position.array;
  for (let i = 0; i < particleCount; i++) {
    pos[i*3] = x; pos[i*3+1] = y; pos[i*3+2] = 0;
    particleVelocity.push({ x: (Math.random() - 0.5) * 8, y: (Math.random() - 0.5) * 8 });
  }
  particles.geometry.attributes.position.needsUpdate = true;
}

// ==========================================
// --- ФИЗИКА ---
// ==========================================
let state = 'air'; 
let velocityX = 0;
let velocityY = 0;
let rotationSpeed = 0; 
let currentPose = 'layout'; 
let isSticking = false; 

let swingAngle = 0;
let swingVelocity = 0;
let swingDirection = 1;
let currentBar = null;
const armLength = 1.7; 
let grabCooldown = 0; 
let isUnwinding = false;

let score = 0;
let combo = 1;
let isComboActive = false;
let lastRotationAngle = 0;
let perfectMultiplier = 1;

const GRAVITY = -25;
const JUMP_FORCE = 15; 
const MAX_SWING_SPEED = 18; 
const FEET_OFFSET = 0.7; 
const AIR_CONTROL = 15; 

let inputLeft = false;
let inputRight = false;

const startPos = new THREE.Vector3(-15, 7, 0); 
const keys = {};
addEventListener('keydown', e => keys[e.code] = true);
addEventListener('keyup', e => keys[e.code] = false);

const scoreEl = document.getElementById('score');
const comboEl = document.getElementById('combo');
const statusEl = document.getElementById('status');
const perfectEl = document.getElementById('perfect-text');

function updateUI(statusText) {
  statusEl.innerHTML = statusText;
  scoreEl.textContent = score;
  if (combo > 1) { comboEl.textContent = `COMBO x${combo}`; comboEl.style.opacity = 1; } else { comboEl.style.opacity = 0; }
}
function addScore(amount) { score += amount * combo * perfectMultiplier; scoreEl.textContent = score; }
function breakCombo() { combo = 1; isComboActive = false; perfectMultiplier = 1; comboEl.style.opacity = 0; }

function showPerfect() {
  perfectEl.classList.add('show');
  setTimeout(() => perfectEl.classList.remove('show'), 600);
  perfectMultiplier = 2;
}

function resetPlayer() {
  playerGroup.position.copy(startPos);
  bodyGroup.rotation.set(0, 0, 0);
  velocityX = 4; velocityY = 0; rotationSpeed = -3; state = 'air'; grabCooldown = 0.5;
  breakCombo(); updateUI("Схватись за турник");
}

// UI (Кнопки игры)
document.getElementById('btn-left').addEventListener('pointerdown', (e) => { e.preventDefault(); inputLeft = true; });
document.getElementById('btn-left').addEventListener('pointerup', () => inputLeft = false);
document.getElementById('btn-left').addEventListener('pointerleave', () => inputLeft = false);

document.getElementById('btn-right').addEventListener('pointerdown', (e) => { e.preventDefault(); inputRight = true; });
document.getElementById('btn-right').addEventListener('pointerup', () => inputRight = false);
document.getElementById('btn-right').addEventListener('pointerleave', () => inputRight = false);

const btnSpin = document.getElementById('btn-spin');
btnSpin.addEventListener('pointerdown', (e) => {
  e.preventDefault(); isUnwinding = true;
  if (state === 'hanging') { currentPose = 'layout'; updateUI("Раскрутка! 🌀"); }
  else if (state === 'air') { rotationSpeed -= 5; } 
});
btnSpin.addEventListener('pointerup', () => isUnwinding = false);
btnSpin.addEventListener('pointerleave', () => isUnwinding = false);

document.getElementById('btn-release').addEventListener('pointerdown', (e) => {
  e.preventDefault();
  if (state === 'air') {
    velocityY = -30; velocityX *= 1.5; updateUI("Ударная волна! 💥");
  } else {
    actionButton();
  }
});

document.getElementById('btn-stick').addEventListener('pointerdown', () => {
  if (state === 'air') { isSticking = true; rotationSpeed = 0; bodyGroup.rotation.x = 0; }
});
document.getElementById('btn-tuck').addEventListener('pointerdown', () => {
  if (state === 'air') { currentPose = 'tuck'; rotationSpeed *= 1.5; velocityY -= 1.5; }
});
document.getElementById('btn-arch').addEventListener('pointerdown', () => {
  if (state === 'air') { currentPose = 'arch'; rotationSpeed *= 0.7; velocityY += 1.5; }
});
document.getElementById('btn-layout').addEventListener('pointerdown', () => {
  if (state === 'air') { currentPose = 'layout'; }
});

function actionButton() {
  if (state === 'hanging') {
    state = 'air';
    grabCooldown = 0.6; 
    
    if (Math.abs(swingVelocity) > MAX_SWING_SPEED * 0.8 && Math.abs(swingAngle) > 0.5) {
      showPerfect();
    } else { perfectMultiplier = 1; }

    velocityX = Math.cos(swingAngle) * swingVelocity * 0.8;
    velocityY = Math.sin(swingAngle) * swingVelocity * 0.8 + 2;
    if (Math.abs(velocityX) < 3) velocityX = 3 * swingDirection;
    
    rotationSpeed = swingVelocity * 0.3; 
    isSticking = false;
    updateUI("В полете!");
  } else if (state === 'grounded') {
    state = 'air'; velocityY = JUMP_FORCE; velocityX = 6; rotationSpeed = -4; grabCooldown = 0.2;
  }
}

renderer.domElement.addEventListener('pointerdown', actionButton);
addEventListener('keydown', e => { 
  if (e.code === 'Space') actionButton(); 
  if (e.code === 'ArrowDown' || e.code === 'KeyS') {
    if (state === 'air') { velocityY = -30; velocityX *= 1.5; }
  }
});

// ==========================================
// --- ИГРОВОЙ ЦИКЛ ---
// ==========================================
const clock = new THREE.Clock();
let isPlaying = false;

// Меню
document.getElementById('btn-play').addEventListener('click', () => {
  document.getElementById('menu-overlay').classList.add('hidden');
  isPlaying = true;
  resetPlayer();
});

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05); 

  if (!isPlaying) {
    const time = clock.getElapsedTime();
    camera.position.x = Math.sin(time * 0.5) * 15;
    camera.position.z = Math.cos(time * 0.5) * 15;
    camera.position.y = 8;
    camera.lookAt(0, 4, 0);
    
    if (currentSkin === 'cape') {
      cape.rotation.x = Math.sin(time * 5) * 0.1;
    }
    
    renderer.render(scene, camera);
    return;
  }

  if (grabCooldown > 0) grabCooldown -= dt;

  if (state === 'air') {
    let moveDir = 0;
    if (keys['KeyA'] || keys['ArrowLeft'] || inputLeft) moveDir -= 1;
    if (keys['KeyD'] || keys['ArrowRight'] || inputRight) moveDir += 1;
    velocityX += moveDir * AIR_CONTROL * dt;
  }

  if (state === 'air') {
    velocityY += GRAVITY * dt;
    playerGroup.position.x += velocityX * dt;
    playerGroup.position.y += velocityY * dt;

    if (!isSticking) {
      bodyGroup.rotation.x += rotationSpeed * dt;
      const currentAngle = bodyGroup.rotation.x;
      if (Math.abs(currentAngle - lastRotationAngle) > Math.PI * 2) {
        lastRotationAngle = currentAngle;
        addScore(100 * Math.floor(Math.abs(rotationSpeed) / 2)); 
        isComboActive = true;
      }
    }

    if (playerGroup.position.x < minX) {
      playerGroup.position.x = minX; velocityX = Math.abs(velocityX) * 0.6; rotationSpeed *= -0.5; spawnParticles(playerGroup.position.x, playerGroup.position.y);
    } else if (playerGroup.position.x > maxX) {
      playerGroup.position.x = maxX; velocityX = -Math.abs(velocityX) * 0.6; rotationSpeed *= -0.5; spawnParticles(playerGroup.position.x, playerGroup.position.y);
    }

    if (playerGroup.position.y <= 0.5 + FEET_OFFSET) {
      const hitSpike = spikeZones.some(sx => Math.abs(playerGroup.position.x - sx) < 2.5);
      if (hitSpike) {
        velocityY = 20; velocityX = -velocityX * 0.5; breakCombo(); 
        updateUI("Шипы! Комбо сгорело 💀"); spawnParticles(playerGroup.position.x, playerGroup.position.y);
      }
    }

    if (grabCooldown <= 0) {
      const handY = playerGroup.position.y + 1.6; 
      for (let p of bars) {
        const distX = Math.abs(playerGroup.position.x - p.x);
        if (distX > 1.2) continue;

        if (Math.abs(handY - p.y) < 0.8 && velocityY < 0) { 
          state = 'hanging'; currentBar = p;
          playerGroup.position.x = p.x;
          playerGroup.position.y = p.y - armLength;
          
          swingVelocity = velocityX * 0.3;
          swingDirection = velocityX >= 0 ? 1 : -1;
          swingAngle = swingDirection === 1 ? -0.3 : 0.3; 
          
          velocityX = 0; velocityY = 0;
          bodyGroup.rotation.x = -swingAngle;
          lastRotationAngle = 0;
          
          if (isComboActive) { combo++; addScore(500); updateUI("Схватился! Комбо x" + combo); } 
          else { addScore(50); updateUI("Схватился!"); }
          spawnParticles(p.x, p.y);
          break;
        }
      }
    }

    if (playerGroup.position.y <= FEET_OFFSET && state === 'air') {
      const hitSpike = spikeZones.some(sx => Math.abs(playerGroup.position.x - sx) < 2.5);
      if (!hitSpike) {
        playerGroup.position.y = FEET_OFFSET; state = 'grounded'; bodyGroup.rotation.x = 0;
        velocityX = 0; velocityY = 0;
        if (combo > 1) { updateUI("Приземление! Комбо сохранено"); } 
        else { updateUI("На мате"); }
        spawnParticles(playerGroup.position.x, playerGroup.position.y);
      }
    }
  } 
  else if (state === 'hanging') {
    if (isUnwinding) {
      swingVelocity += 15 * dt * swingDirection; 
      if (Math.abs(swingVelocity) > MAX_SWING_SPEED) swingVelocity = MAX_SWING_SPEED * swingDirection;
    }

    const gravityEffect = -(GRAVITY / armLength) * Math.sin(swingAngle);
    swingVelocity += gravityEffect * dt;
    swingVelocity *= 0.99; 
    swingAngle += swingVelocity * dt;

    playerGroup.position.x = currentBar.x + Math.sin(swingAngle) * armLength;
    playerGroup.position.y = currentBar.y - Math.cos(swingAngle) * armLength;
    
    bodyGroup.rotation.x = -swingAngle;
  }

  // VFX
  const posAttr = trailGeo.attributes.position.array;
  posAttr[trailIndex * 3] = playerGroup.position.x;
  posAttr[trailIndex * 3 + 1] = playerGroup.position.y + 1.0;
  posAttr[trailIndex * 3 + 2] = 0;
  trailIndex = (trailIndex + 1) % trailLength;
  trailGeo.attributes.position.needsUpdate = true;
  
  const speed = Math.abs(velocityX) + Math.abs(velocityY) + Math.abs(rotationSpeed);
  trailLine.material.opacity = Math.min(speed * 0.02, 0.7);

  if (particleTimer > 0) {
    particleTimer -= dt;
    const pPos = particles.geometry.attributes.position.array;
    for (let i = 0; i < particleCount; i++) {
      pPos[i*3] += particleVelocity[i].x * dt;
      pPos[i*3+1] += particleVelocity[i].y * dt;
    }
    particles.geometry.attributes.position.needsUpdate = true;
    particleMat.opacity = particleTimer * 2; 
  } else { particleMat.opacity = 0; }

  // Анимация
  if (state === 'hanging') {
    leftArm.rotation.x = Math.PI; rightArm.rotation.x = Math.PI;
    leftLeg.rotation.x = 0.2 + swingVelocity * 0.1; rightLeg.rotation.x = 0.2 + swingVelocity * 0.1;
  } else if (state === 'air') {
    let legSwing = 0;
    if (keys['KeyA'] || keys['ArrowLeft'] || inputLeft) legSwing = 0.5;
    if (keys['KeyD'] || keys['ArrowRight'] || inputRight) legSwing = -0.5;

    if (currentPose === 'tuck') {
      leftLeg.rotation.x = -Math.PI / 1.5; rightLeg.rotation.x = -Math.PI / 1.5;
      leftArm.rotation.x = -Math.PI / 2; rightArm.rotation.x = -Math.PI / 2;
    } else if (currentPose === 'arch') {
      leftLeg.rotation.x = 0.5; rightLeg.rotation.x = 0.5;
      leftArm.rotation.x = -0.5; rightArm.rotation.x = -0.5;
    } else {
      leftLeg.rotation.x = legSwing; rightLeg.rotation.x = -legSwing;
      leftArm.rotation.x = Math.PI; rightArm.rotation.x = Math.PI;
    }
  } else {
    leftArm.rotation.x = 0; rightArm.rotation.x = 0;
    leftLeg.rotation.x = 0; rightLeg.rotation.x = 0; bodyGroup.rotation.x = 0;
  }

  // Плащ
  if (currentSkin === 'cape') {
    const speed = Math.abs(velocityX) + Math.abs(velocityY) + Math.abs(rotationSpeed);
    const targetRot = Math.min(speed * 0.05, 1.2); 
    cape.rotation.x = THREE.MathUtils.lerp(cape.rotation.x, targetRot, 0.1);
  }

  // Камера
  const targetCamX = playerGroup.position.x;
  camera.position.x = THREE.MathUtils.lerp(camera.position.x, targetCamX, 5 * dt);
  camera.position.y = 6.0; camera.position.z = 20; 
  camera.lookAt(camera.position.x, playerGroup.position.y + 1.0, 0);

  renderer.render(scene, camera);
}

resetPlayer();
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
